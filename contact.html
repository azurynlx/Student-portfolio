
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Olamide Asabi through the BlushScholar student portfolio website.">
    <meta name="theme-color" content="#f8dce5">

    <title>Contact | Olamide Asabi</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar" aria-label="Main navigation">
        <div class="logo">Blush<span>Scholar</span></div>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="planner.html">Planner</a></li>
            <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
        </ul>

        <button
            type="button"
            class="hamburger"
            id="hamburger"
            aria-label="Toggle navigation menu"
            aria-controls="navLinks"
            aria-expanded="false">
            &#9776;
        </button>
    </nav>

    <!-- Main Contact Section -->
    <main class="page-content">

        <h1 class="page-title">Contact Me</h1>

        <p class="page-intro">
            Have a question or want to connect? Send me a message.
        </p>

        <!-- Contact Form -->
        <form id="contactForm" class="contact-form" novalidate>

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="100"
                    required
                    aria-describedby="nameError">

                <small
                    class="error-message"
                    id="nameError"
                    aria-live="polite"></small>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    maxlength="150"
                    required
                    aria-describedby="emailError">

                <small
                    class="error-message"
                    id="emailError"
                    aria-live="polite"></small>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone (digits only)"
                    inputmode="numeric"
                    autocomplete="tel"
                    maxlength="15"
                    required
                    aria-describedby="phoneError">

                <small
                    class="error-message"
                    id="phoneError"
                    aria-live="polite"></small>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    maxlength="1000"
                    placeholder="Write your message here..."
                    required
                    aria-describedby="messageError"></textarea>

                <small
                    class="error-message"
                    id="messageError"
                    aria-live="polite"></small>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">
                Send Message
            </button>

            <!-- Success Message -->
            <p
                id="formSuccess"
                class="success-message"
                role="status"
                aria-live="polite"></p>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Olamide Asabi | COS 106 Term Project</p>
    </footer>

    <!-- Contact Form JavaScript -->
    <script src="js/contact.js"></script>

    <!-- Mobile Navigation JavaScript -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        hamburger.addEventListener('click', function() {
            const isExpanded =
                hamburger.getAttribute('aria-expanded') === 'true';

            navLinks.classList.toggle('show');

            hamburger.setAttribute(
                'aria-expanded',
                String(!isExpanded)
            );
        });

        // Close the menu when a navigation link is selected.
        navLinks.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                navLinks.classList.remove('show');
                hamburger.setAttribute('aria-expanded', 'false');
            });
        });

        // Close the menu when Escape is pressed.
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                navLinks.classList.remove('show');
                hamburger.setAttribute('aria-expanded', 'false');
            }
        });
    </script>

</body>
</html>
